name: Demo Workflow

on:
  push:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python app.py

  hello:

    runs-on: ubuntu-latest

    steps:
      - run: echo "Hello from another job!"

  system-info:

    runs-on: ubuntu-latest

    steps:
      - run: uname -a
      - run: python --version
      - run: pwd